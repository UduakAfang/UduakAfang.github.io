<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 372" width="924" height="372" role="img" aria-label="Data pipeline: mismatched GPS exports feed an AI reader, an AI column mapper, a load engine, and a coach dashboard." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><pattern id="canvasdots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="0.85" fill="#d3d5d3"></circle></pattern>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4" fill="none" stroke="#14352a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
  </defs>
  
  <rect x="0" y="0" width="924" height="372" rx="10" fill="#f6f7f6"></rect><rect x="0" y="0" width="924" height="372" rx="10" fill="url(#canvasdots)"></rect>
  <rect x="4" y="4" width="916" height="364" rx="8" fill="none" stroke="#dfe1df" stroke-width="1"></rect>
  <g transform="translate(12,16)">
    
    <g transform="translate(14,44) rotate(-2)">
      <rect class="ink" x="0" y="0" width="120" height="66" rx="4" fill="#ffffff"></rect>
      <text class="h" x="10" y="18" font-size="12">Catapult</text>
      <rect x="10" y="26" width="86" height="9" fill="#bf4230" opacity=".8"></rect>
      <text class="mut" x="10" y="50" font-size="10.5">“Total Distance”</text>
    </g>
    <g transform="translate(20,120) rotate(1.5)">
      <rect class="ink" x="0" y="0" width="120" height="66" rx="4" fill="#ffffff"></rect>
      <text class="h" x="10" y="18" font-size="12">STATSports</text>
      <rect x="10" y="26" width="60" height="9" fill="#2f6f57" opacity=".85"></rect>
      <text class="mut" x="10" y="50" font-size="10.5">“TD”</text>
    </g>
    <g transform="translate(14,196) rotate(-1)">
      <rect class="ink" x="0" y="0" width="120" height="66" rx="4" fill="#ffffff"></rect>
      <text class="h" x="10" y="18" font-size="12">no-date sheet</text>
      <rect x="10" y="26" width="74" height="9" fill="#3f6ea5" opacity=".8"></rect>
      <text class="mut" x="10" y="50" font-size="10.5">06/07 → ??</text>
    </g>
    <text class="mut" x="18" y="300" font-size="11">any vendor · any layout · any language</text>

    <path class="ink" d="M140,78 C168,110 172,150 196,166" marker-end="url(#arw)"></path>
    <path class="ink" d="M144,153 L192,166" marker-end="url(#arw)"></path>
    <path class="ink" d="M140,224 C168,196 172,182 196,172" marker-end="url(#arw)"></path>

    <g transform="translate(200,128)">
      <rect class="ink" x="0" y="0" width="150" height="86" rx="6" fill="#f7f7f5"></rect>
      <text class="h" x="14" y="26" font-size="13">AI reads it</text>
      <text class="lab" x="14" y="46" font-size="11">“what is this</text>
      <text class="lab" x="14" y="61" font-size="11">file, really?”</text>
      <text class="mut" x="14" y="78" font-size="9.5">structure · dates · one day?</text>
    </g>
    <path class="ink" d="M350,171 L392,171" marker-end="url(#arw)"></path>

    <g transform="translate(396,128)">
      <rect class="ink" x="0" y="0" width="150" height="86" rx="6" fill="#f7f7f5"></rect>
      <text class="h" x="14" y="26" font-size="13">Maps columns</text>
      <text class="lab" x="14" y="46" font-size="11">TD, td, km →</text>
      <text class="lab" x="14" y="61" font-size="11">total_distance_m</text>
      <text class="mut" x="14" y="78" font-size="9.5">one canonical schema</text>
    </g>
    <path class="ink" d="M546,171 L588,171" marker-end="url(#arw)"></path>

    <g transform="translate(592,120)">
      <rect class="ink" x="0" y="0" width="150" height="102" rx="6" fill="#14352a"></rect>
      <text class="h" x="14" y="26" font-size="13" fill="#ffffff">Load engine</text>
      <text class="lab" x="14" y="47" font-size="11" fill="#e9efe9">player × day ×</text>
      <text class="lab" x="14" y="62" font-size="11" fill="#e9efe9">metric (EWMA)</text>
      <text class="lab" x="14" y="84" font-size="11" fill="#e8926f">→ acute : chronic</text>
    </g>
    <path class="ink" d="M742,171 L784,171" marker-end="url(#arw)"></path>

    <g transform="translate(788,132)">
      <rect class="ink" x="0" y="0" width="98" height="78" rx="6" fill="#ffffff"></rect>
      <text class="h" x="12" y="22" font-size="12">Coach</text>
      <circle cx="18" cy="42" r="7" fill="#2f6f57"></circle>
      <circle cx="40" cy="42" r="7" fill="#e0a24e"></circle>
      <circle cx="62" cy="42" r="7" fill="#bf4230"></circle>
      <circle cx="18" cy="62" r="7" fill="#2f6f57"></circle>
      <circle cx="40" cy="62" r="7" fill="#2f6f57"></circle>
      <circle cx="62" cy="62" r="7" fill="#e0a24e"></circle>
    </g>
  </g>
</svg>