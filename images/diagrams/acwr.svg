<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 392" width="924" height="392" role="img" aria-label="Acute to chronic workload ratio over a season, with a green safe band from 0.8 to 1.3, a yellow detraining zone below, and a red injury-risk zone above." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="924" height="392" rx="10" fill="#f6f7f6"></rect><rect x="0" y="0" width="924" height="392" rx="10" fill="url(#canvasdots)"></rect>
  <rect x="4" y="4" width="916" height="384" rx="8" fill="none" stroke="#dfe1df" stroke-width="1"></rect>
  <g transform="translate(12,16)">
    <rect x="70" y="30" width="790" height="86" fill="#bf4230" opacity=".12"></rect>
    <rect x="70" y="116" width="790" height="96" fill="#2f6f57" opacity=".16"></rect>
    <rect x="70" y="212" width="790" height="70" fill="#e0a24e" opacity=".16"></rect>
    <line class="dash" x1="70" y1="116" x2="860" y2="116" stroke="#bf4230"></line>
    <line class="dash" x1="70" y1="212" x2="860" y2="212" stroke="#c99a3a"></line>
    <line class="axis" x1="70" y1="30" x2="70" y2="300"></line>
    <line class="axis" x1="70" y1="300" x2="860" y2="300"></line>
    <text class="glab" x="82" y="52" font-size="13" fill="#a3331f">INJURY RISK</text>
    <text class="gmut" x="82" y="68" font-size="11">ratio &gt; 1.3 — spiking too fast</text>
    <text class="glab" x="82" y="150" font-size="13" fill="#1f5a44">SWEET SPOT</text>
    <text class="gmut" x="82" y="166" font-size="11">0.8 – 1.3 — load matched to fitness</text>
    <text class="glab" x="82" y="246" font-size="13" fill="#9a6a12">DETRAINING</text>
    <text class="gmut" x="82" y="262" font-size="11">ratio &lt; 0.8 — losing conditioning</text>
    <text class="gmut" x="40" y="120" font-size="11" text-anchor="end">1.3</text>
    <text class="gmut" x="40" y="216" font-size="11" text-anchor="end">0.8</text>
    <path d="M70,238 C130,225 150,180 200,172 C250,164 270,150 320,150              C370,150 400,170 440,168 C490,166 520,150 560,138              C600,126 630,96 665,92 C700,88 720,150 760,168              C800,184 830,175 860,170" fill="none" stroke="#14352a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="665" cy="92" r="6.5" fill="#bf4230" stroke="#ffffff" stroke-width="2"></circle>
    <text class="glab" x="655" y="78" font-size="11.5" fill="#a3331f" text-anchor="end">overload — pull him back</text>
    <text class="gmut" x="465" y="330" font-size="11.5" text-anchor="middle">one season · exponentially-weighted 7-day load ÷ 28-day load</text>
  </g>
</svg>