    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Satoshi', 'sans-serif'],
              serif: ['Satoshi', 'sans-serif'],
              display: ['Satoshi', 'sans-serif'],
              hand: ['Caveat', 'cursive'],
              condensed: ['"Saira Condensed"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              bone: '#FFFFFF',
              primary: '#834DFB', // Electric Violet (purple accent)
              secondary: '#F0E100', // Turbo (yellow accent)

            },
            animation: {
              'float': 'float 6s ease-in-out infinite',

    <style>
      /* Smooth scrolling is handled by GSAP mostly, but this helps defaults */
      html {
        scroll-behavior: smooth;
      }
      
      /* Performance optimizations for animations */
      .service-title-fill-wrapper,
      .service-title-fill,
      .service-title-fill-dark,
      .section-title-cut,
      .stack-section {
        will-change: transform, opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      
      /* Reduce motion for users who prefer it */
      @media (prefers-reduced-motion: reduce) {
        .service-title-fill-wrapper,
        .service-title-fill,
        .service-title-fill-dark,
        .section-title-cut,
        .stack-section {
          will-change: auto;
          animation: none !important;
          transition: none !important;
        }
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D5DB;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9CA3AF;
      }
      
      .bg-dot-pattern {
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 24px 24px;
      }
      
      .dark .bg-dot-pattern {
        background-color: #020617; 
        background-image: radial-gradient(#1e293b 1px, transparent 1px); 
      }
      
      body {
        transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
      }

      /* Utilities for reveal masks */
      .reveal-text-container {
        overflow: hidden;
      }

      /* Grid system with 64px margins */
      .grid-container {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 64px;
      }

      @media (max-width: 768px) {
        .grid-container {
          padding: 0 24px;
        }
      }

      /* Rotating animation for Hire Me button */
      @keyframes spin-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .animate-spin-slow {
        animation: spin-slow 10s linear infinite;
      }

      /* Curtain fold animation */
      .curtain-section {
        position: relative;
        transform-origin: center top;
        will-change: transform;
      }

      /* Card hover fix to prevent jumping */
      .portfolio-card {
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      /* Smooth sticky transitions */
      .sticky-section {
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
