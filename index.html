<style>
  /* Boot cover — shown until React mounts, then removed. */
  #boot {
    position: fixed; inset: 0; z-index: 9998;
    background: #fcfcfc;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot .mk {
    font-family: Satoshi, system-ui, sans-serif;
    font-weight: 900; font-size: 58px; letter-spacing: -.04em;
    color: #2e2c25; line-height: 1;
    animation: bootPulse 1.15s ease-in-out infinite;
  }
  #boot .mk span { color: #d34530; }
  @keyframes bootPulse {
    0%,100% { opacity: .28; transform: scale(.97); }
    50%     { opacity: 1;   transform: scale(1);   }
  }
</style>
</head>
<body>
<div id="boot"><div class="mk">UA<span>.</span></div></div>
<div id="root"></div>

<!-- Hide the boot cover as soon as React renders into #root (fallback timeout). -->
<script>
  (function () {
    var boot = document.getElementById('boot');
    var root = document.getElementById('root');
    if (!boot || !root) return;
    var hide = function () { boot.classList.add('gone'); };
    var mo = new MutationObserver(function () {
      if (root.children.length) { hide(); mo.disconnect(); }
    });
    mo.observe(root, { childList: true });
    setTimeout(hide, 8000);
  })();
</script>
