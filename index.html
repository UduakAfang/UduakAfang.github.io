<style>
  html, body { background:#f4f1eb; color:#1a1a1a; }
  body { font-family: Satoshi, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection { background:#C7522A; color:#f4f1eb; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(26,26,26,.18); border-radius:6px; }

  .eyebrow { font-family: "JetBrains Mono", monospace; font-size:11px; letter-spacing:.28em; text-transform:uppercase; }
  .pagenum { font-family: "JetBrains Mono", monospace; font-size:10px; letter-spacing:.32em; }
  .mono    { font-family: "JetBrains Mono", monospace; }
  .display { font-family: "Saira Condensed", sans-serif; font-weight:900; letter-spacing:-0.02em; line-height:.9; text-transform:uppercase; }
  .serif-it{ font-family: "Instrument Serif", serif; font-style:italic; font-weight:400; letter-spacing:-0.01em; }

  /* paper texture (subtle) */
  .paper-grain { background-image:
    radial-gradient(rgba(26,26,26,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* underline link */
  .ul-link { position:relative; display:inline-block; }
  .ul-link::after { content:""; position:absolute; left:0; bottom:-2px; height:1px; width:100%; background:currentColor; transform:scaleX(.3); transform-origin:left; transition: transform .4s cubic-bezier(.2,.6,.2,1); }
  .ul-link:hover::after { transform:scaleX(1); }

  /* card lift */
  .card-lift { transition: transform .5s cubic-bezier(.2,.6,.2,1), box-shadow .5s; will-change:transform; }
  .card-lift:hover { transform: translateY(-4px); }

  /* sticky pill behavior */
  .stuck { backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); }

  /* skill bar */
  .skill-track { background:rgba(26,26,26,.08); border-radius:999px; overflow:hidden; position:relative; }
  .skill-fill  { position:absolute; inset:0 auto 0 0; background:#1a1a1a; border-radius:999px; }

  /* marquee */
  @keyframes marq { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .marquee-track { animation: marq 38s linear infinite; }

  /* tag pill */
  .tag-pill { background:#1a1a1a; color:#f4f1eb; padding:6px 12px; border-radius:999px; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; display:inline-flex; align-items:center; gap:6px; }
  .tag-pill.ghost { background:transparent; color:#1a1a1a; border:1px solid rgba(26,26,26,.2); }

  /* reveal — slide up (re-triggerable: .in removed when out of view) */
  .reveal { opacity:0; transform: translateY(36px); transition: opacity .9s cubic-bezier(.2,.6,.2,1), transform .9s cubic-bezier(.2,.6,.2,1); }
  .reveal.in { opacity:1; transform: translateY(0); }

  /* reveal from left */
  .reveal-left { opacity:0; transform: translateX(-40px); transition: opacity .7s cubic-bezier(.2,.6,.2,1), transform .7s cubic-bezier(.2,.6,.2,1); }
  .reveal-left.in { opacity:1; transform: translateX(0); }

  /* reveal scale — cards pop in from small + fade */
  .reveal-pop { opacity:0; transform: scale(0.88) translateY(24px); transition: opacity .7s cubic-bezier(.2,.6,.2,1), transform .7s cubic-bezier(.2,.6,.2,1); }
  .reveal-pop.in { opacity:1; transform: scale(1) translateY(0); }

  /* flip-reveal — 3D card flip from behind (Y axis) */
  .flip-reveal { perspective: 1200px; }
  .flip-reveal > * { opacity:0; transform: rotateY(-90deg) scale(0.9); transform-origin: left center; transition: opacity .8s cubic-bezier(.2,.6,.2,1), transform .8s cubic-bezier(.2,.6,.2,1); }
  .flip-reveal.in > * { opacity:1; transform: rotateY(0deg) scale(1); }

  /* flip-reveal-alt — flip from opposite direction */
  .flip-reveal-alt { perspective: 1200px; }
  .flip-reveal-alt > * { opacity:0; transform: rotateY(90deg) scale(0.9); transform-origin: right center; transition: opacity .8s cubic-bezier(.2,.6,.2,1), transform .8s cubic-bezier(.2,.6,.2,1); }
  .flip-reveal-alt.in > * { opacity:1; transform: rotateY(0deg) scale(1); }

  /* flip-reveal-x — flip from top (X axis) */
  .flip-reveal-x { perspective: 1200px; }
  .flip-reveal-x > * { opacity:0; transform: rotateX(70deg) scale(0.9); transform-origin: top center; transition: opacity .8s cubic-bezier(.2,.6,.2,1), transform .8s cubic-bezier(.2,.6,.2,1); }
  .flip-reveal-x.in > * { opacity:1; transform: rotateX(0deg) scale(1); }

  /* scroll-darken button */
  .scroll-darken { transition: background-color .6s ease, color .6s ease, border-color .6s ease; }
  .scroll-darken.scrolled-in { background-color: #1a1a1a; color: #f4f1eb; border-color: #1a1a1a; }

  /* stagger-flip: children flip in with stagger (alternating L/R) */
  .stagger-flip { perspective: 1200px; }
  .stagger-flip > * { opacity:0; transform-style: preserve-3d; transition: opacity .8s cubic-bezier(.2,.6,.2,1), transform .8s cubic-bezier(.2,.6,.2,1); }
  .stagger-flip > *:nth-child(odd)  { transform: rotateY(-90deg) scale(0.9); transform-origin: left center; }
  .stagger-flip > *:nth-child(even) { transform: rotateY(90deg) scale(0.9);  transform-origin: right center; }
  .stagger-flip.in > * { opacity:1; transform: rotateY(0deg) scale(1); }
  .stagger-flip > *:nth-child(1) { transition-delay: 0ms; }
  .stagger-flip > *:nth-child(2) { transition-delay: 120ms; }
  .stagger-flip > *:nth-child(3) { transition-delay: 240ms; }
  .stagger-flip > *:nth-child(4) { transition-delay: 360ms; }
  .stagger-flip > *:nth-child(5) { transition-delay: 480ms; }
  .stagger-flip > *:nth-child(6) { transition-delay: 600ms; }

  /* Profile card flip animation */
  @keyframes flipIn {
    0% { transform: perspective(1000px) rotateY(-90deg); opacity: 0; }
    50% { transform: perspective(1000px) rotateY(-10deg); }
    100% { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
  }
  .profile-flip {
    animation: flipIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
    transform-style: preserve-3d;
  }

  /* number indicator */
  .num-dot { width:38px; height:38px; border-radius:50%; border:1px solid rgba(26,26,26,.25); display:inline-flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-size:11px; }

  /* dashed divider */
  .dash-div { background-image: linear-gradient(to right, rgba(26,26,26,.35) 50%, transparent 0); background-position: bottom; background-size: 8px 1px; background-repeat: repeat-x; padding-bottom: 1px; }

  /* Section stacking — sticky cards pattern.
     min-height:100vh ensures each section fully covers the viewport
     when it's stuck, so previous sections can't peek through. */
  .stack-section {
    position: sticky;
    top: 0;
    min-height: 100vh;
    isolation: isolate;
  }
  /* curved "cuff" top — every section after the hero gets a rounded top edge
     so stacking sections scoop over the one beneath them */
  .stack-cuff {
    border-radius: 36px 36px 0 0;
    margin-top: -36px;       /* overlap previous section to hide the seam */
    padding-top: 36px;       /* restore content spacing lost by negative margin */
  }

  /* hide tweaks panel chrome bleed */
  [data-tweaks-host] { font-family: Satoshi, system-ui, sans-serif; }

  /* ─── Loading screen ─── */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    background: #f4f1eb;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #loader .mark {
    font-family: "Saira Condensed", sans-serif;
    font-weight: 900; font-size: 64px; letter-spacing: -0.04em;
    color: #1a1a1a; line-height: 1;
    animation: loaderPulse 1.2s ease-in-out infinite;
  }
  #loader .mark span { color: #C7522A; }
  @keyframes loaderPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.96); }
    50%      { opacity: 1;   transform: scale(1);    }
  }
</style>
